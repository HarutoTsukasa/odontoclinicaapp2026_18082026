<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title th:text="${titulo} + ' · Clínica Odontológica'">Clínica Odontológica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>

<!-- Barra superior visible solo en movil/tablet: abre el menu en un offcanvas -->
<div th:fragment="topbar" class="topbar">
  <a class="brand" href="/" style="color:var(--clinic-teal-dark)">
    <span class="brand__mark" style="background:var(--clinic-teal-soft)"><i class="bi bi-heart-pulse"></i></span>
    <span>Clínica Odontológica</span>
  </a>
  <button class="btn btn-outline-clinic btn-sm" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuLateral"
          aria-controls="menuLateral" aria-label="Abrir menú" title="Abrir menú" data-bs-original-title="Abrir menú">
    <i class="bi bi-list"></i> Menú
  </button>
</div>

<!-- Contenido del menu, usado tanto en el sidebar fijo (desktop) como en el offcanvas (movil) -->
<th:block th:fragment="menuItems(activo)">
  <ul class="sidebar-nav">
    <li><a href="/" th:classappend="${activo == 'inicio'} ? 'active'" title="Inicio"><i class="bi bi-house-door"></i> <span>Inicio</span></a></li>
    <li><a href="/pacientes" th:classappend="${activo == 'pacientes'} ? 'active'" title="Pacientes"><i class="bi bi-people"></i> <span>Pacientes</span></a></li>
    <li><a href="/odontologos" th:classappend="${activo == 'odontologos'} ? 'active'" title="Odontólogos"><i class="bi bi-person-badge"></i> <span>Odontólogos</span></a></li>
    <li><a href="/citas" th:classappend="${activo == 'citas'} ? 'active'" title="Citas"><i class="bi bi-calendar3"></i> <span>Citas</span></a></li>
    <li><a href="/tratamientos" th:classappend="${activo == 'tratamientos'} ? 'active'" title="Tratamientos"><i class="bi bi-clipboard2-pulse"></i> <span>Tratamientos</span></a></li>
    <li><a href="/insumos" th:classappend="${activo == 'insumos'} ? 'active'" title="Insumos"><i class="bi bi-box-seam"></i> <span>Insumos</span></a></li>
    <li><a href="/facturas" th:classappend="${activo == 'facturas'} ? 'active'" title="Facturas"><i class="bi bi-receipt"></i> <span>Facturas</span></a></li>
  </ul>
</th:block>

<aside th:fragment="sidebar(activo)" class="sidebar d-none d-lg-block">
  <a class="brand" href="/">
    <span class="brand__mark"><i class="bi bi-heart-pulse"></i></span>
    <span>Clínica Odontológica</span>
  </a>
  <div th:replace="~{fragments/layout :: menuItems(${activo})}"></div>
</aside>

<div th:fragment="offcanvasMenu(activo)" class="offcanvas offcanvas-start" tabindex="-1" id="menuLateral">
  <div class="offcanvas-header">
    <span class="brand" style="color:var(--clinic-teal-dark)"><i class="bi bi-heart-pulse"></i> Clínica Odontológica</span>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
  </div>
  <div class="offcanvas-body">
    <div th:replace="~{fragments/layout :: menuItems(${activo})}"></div>
  </div>
</div>

<!--
  Los mensajes flash (exito/error) ya no se pintan como alert de Bootstrap:
  se exponen como data-attributes en un nodo oculto y script.js los recoge
  para mostrarlos como toast de SweetAlert2. Si mensaje/error son null,
  Thymeleaf omite el atributo por completo (comportamiento estandar de th:*).
-->
<th:block th:fragment="mensajes">
  <div id="flash-data" class="d-none" th:data-mensaje="${mensaje}" th:data-error="${error}"></div>
</th:block>

<th:block th:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/js/script.js"></script>
</th:block>

</body>
</html>
