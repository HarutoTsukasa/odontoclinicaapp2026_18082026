<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${paciente.idPaciente} == null ? 'Nuevo paciente' : 'Editar paciente')}"></head>
<body>
<div th:replace="~{fragments/layout :: topbar}"></div>
<div class="app-shell">
  <aside th:replace="~{fragments/layout :: sidebar('pacientes')}"></aside>
  <div th:replace="~{fragments/layout :: offcanvasMenu('pacientes')}"></div>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 th:text="${paciente.idPaciente} == null ? 'Nuevo paciente' : 'Editar paciente'">Paciente</h1>
        <p>Los campos marcados con * son obligatorios</p>
      </div>
      <a class="btn btn-outline-clinic" href="/pacientes">← Volver al listado</a>
    </div>

    <div class="card-soft p-3 p-lg-4" style="max-width: 720px;">
      <form th:action="@{/pacientes/guardar}" th:object="${paciente}" method="post" class="needs-validation" novalidate>
        <input type="hidden" th:field="*{idPaciente}" />

        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Nombre *</label>
            <input type="text" class="form-control" th:field="*{nombre}" required
                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">Error</div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Apellido *</label>
            <input type="text" class="form-control" th:field="*{apellido}" required
                   th:classappend="${#fields.hasErrors('apellido')} ? 'is-invalid'" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}">Error</div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Fecha de nacimiento *</label>
            <input type="date" class="form-control" th:field="*{fechaNacimiento}" required
                   th:classappend="${#fields.hasErrors('fechaNacimiento')} ? 'is-invalid'" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}">Error</div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Género</label>
            <select class="form-select" th:field="*{genero}">
              <option value="">Selecciona...</option>
              <option th:each="g : ${generos}" th:value="${g}" th:text="${g}">M</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Teléfono</label>
            <input type="tel" class="form-control" th:field="*{telefono}" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" th:field="*{email}"
                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error</div>
          </div>
          <div class="col-12">
            <label class="form-label">Dirección</label>
            <input type="text" class="form-control" th:field="*{direccion}" />
          </div>
        </div>

        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-clinic">Guardar</button>
          <a class="btn btn-outline-secondary" href="/pacientes">Cancelar</a>
        </div>
      </form>
    </div>
  </main>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
