<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${odontologo.idOdontologo} == null ? 'Nuevo odontólogo' : 'Editar odontólogo')}"></head>
<body>
<div th:replace="~{fragments/layout :: topbar}"></div>
<div class="app-shell">
  <aside th:replace="~{fragments/layout :: sidebar('odontologos')}"></aside>
  <div th:replace="~{fragments/layout :: offcanvasMenu('odontologos')}"></div>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 th:text="${odontologo.idOdontologo} == null ? 'Nuevo odontólogo' : 'Editar odontólogo'">Odontólogo</h1>
        <p>Los campos marcados con * son obligatorios</p>
      </div>
      <a class="btn btn-outline-clinic" href="/odontologos">← Volver al listado</a>
    </div>

    <div class="card-soft p-3 p-lg-4" style="max-width: 720px;">
      <form th:action="@{/odontologos/guardar}" th:object="${odontologo}" method="post" class="needs-validation" novalidate>
        <input type="hidden" th:field="*{idOdontologo}" />
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Nombre *</label>
            <input type="text" class="form-control" th:field="*{nombre}" required
                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">Error</div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Apellido *</label>
            <input type="text" class="form-control" th:field="*{apellido}" required
                   th:classappend="${#fields.hasErrors('apellido')} ? 'is-invalid'" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}">Error</div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Especialidad *</label>
            <input type="text" class="form-control" th:field="*{especialidad}" required
                   th:classappend="${#fields.hasErrors('especialidad')} ? 'is-invalid'" placeholder="Ej. Ortodoncia" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('especialidad')}" th:errors="*{especialidad}">Error</div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Fecha de contratación *</label>
            <input type="date" class="form-control" th:field="*{fechaContratacion}" required
                   th:classappend="${#fields.hasErrors('fechaContratacion')} ? 'is-invalid'" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('fechaContratacion')}" th:errors="*{fechaContratacion}">Error</div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Teléfono</label>
            <input type="tel" class="form-control" th:field="*{telefono}" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" th:field="*{email}"
                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error</div>
          </div>
        </div>
        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-clinic">Guardar</button>
          <a class="btn btn-outline-secondary" href="/odontologos">Cancelar</a>
        </div>
      </form>
    </div>
  </main>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
