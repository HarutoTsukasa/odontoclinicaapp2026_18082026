<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Citas')}"></head>
<body>
<div th:replace="~{fragments/layout :: topbar}"></div>
<div class="app-shell">
  <aside th:replace="~{fragments/layout :: sidebar('citas')}"></aside>
  <div th:replace="~{fragments/layout :: offcanvasMenu('citas')}"></div>

  <main class="main-content">
    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <div class="page-header">
      <div>
        <h1>Citas</h1>
        <p th:text="${#lists.size(citas)} + ' cita(s) registrada(s)'">0</p>
      </div>
      <a class="btn btn-clinic" href="/citas/nueva">+ Nueva cita</a>
    </div>

    <div class="card-soft">
      <div class="table-responsive">
        <table class="table table-clinic mb-0 align-middle">
          <thead>
            <tr>
              <th>Fecha y hora</th>
              <th>Paciente</th>
              <th class="d-none d-md-table-cell">Odontólogo</th>
              <th>Estado</th>
              <th class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="c : ${citas}">
              <td th:text="${#temporals.format(c.fechaHora, 'dd/MM/yyyy HH:mm')}">01/01/2026 09:00</td>
              <td th:text="${c.paciente.nombre} + ' ' + ${c.paciente.apellido}">Paciente</td>
              <td class="d-none d-md-table-cell" th:text="'Dr(a). ' + ${c.odontologo.apellido}">Odontólogo</td>
              <td><span class="badge-estado" th:classappend="'badge-' + ${c.estado}" th:text="${c.estado}">Estado</span></td>
              <td class="text-end">
                <a class="btn btn-sm btn-outline-clinic" th:href="@{/citas/detalle/{id}(id=${c.idCita})}">Ver</a>
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/citas/editar/{id}(id=${c.idCita})}">Editar</a>
                <form th:action="@{/citas/eliminar/{id}(id=${c.idCita})}" method="post" class="d-inline"
                      data-confirm="¿Eliminar esta cita y todo su detalle?">
                  <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                </form>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(citas)}">
              <td colspan="5" class="text-center text-muted py-4">No hay citas registradas todavía.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
