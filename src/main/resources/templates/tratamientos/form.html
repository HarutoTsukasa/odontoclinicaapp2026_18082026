<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${tratamiento.idTratamiento} == null ? 'Nuevo tratamiento' : 'Editar tratamiento')}"></head>
<body>
<div th:replace="~{fragments/layout :: topbar}"></div>
<div class="app-shell">
  <aside th:replace="~{fragments/layout :: sidebar('tratamientos')}"></aside>
  <div th:replace="~{fragments/layout :: offcanvasMenu('tratamientos')}"></div>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 th:text="${tratamiento.idTratamiento} == null ? 'Nuevo tratamiento' : 'Editar tratamiento'">Tratamiento</h1>
        <p>Los campos marcados con * son obligatorios</p>
      </div>
      <a class="btn btn-outline-clinic" href="/tratamientos">← Volver al listado</a>
    </div>

    <div class="card-soft p-3 p-lg-4" style="max-width: 640px;">
      <form th:action="@{/tratamientos/guardar}" th:object="${tratamiento}" method="post" class="needs-validation" novalidate>
        <input type="hidden" th:field="*{idTratamiento}" />
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label">Nombre *</label>
            <input type="text" class="form-control" th:field="*{nombre}" required
                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">Error</div>
          </div>
          <div class="col-12">
            <label class="form-label">Descripción</label>
            <textarea class="form-control" rows="3" th:field="*{descripcion}"></textarea>
          </div>
          <div class="col-md-6">
            <label class="form-label">Costo (COP) *</label>
            <input type="number" step="0.01" min="0" class="form-control" th:field="*{costo}" required
                   th:classappend="${#fields.hasErrors('costo')} ? 'is-invalid'" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('costo')}" th:errors="*{costo}">Error</div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Duración estimada (min)</label>
            <input type="number" min="0" class="form-control" th:field="*{duracionEstimada}" />
          </div>
        </div>
        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-clinic">Guardar</button>
          <a class="btn btn-outline-secondary" href="/tratamientos">Cancelar</a>
        </div>
      </form>
    </div>
  </main>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
