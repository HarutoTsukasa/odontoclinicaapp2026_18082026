<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tratamientos')}"></head>
<body>
<div th:replace="~{fragments/layout :: topbar}"></div>
<div class="app-shell">
  <aside th:replace="~{fragments/layout :: sidebar('tratamientos')}"></aside>
  <div th:replace="~{fragments/layout :: offcanvasMenu('tratamientos')}"></div>

  <main class="main-content">
    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <div class="page-header">
      <div>
        <h1>Tratamientos</h1>
        <p>Catálogo de procedimientos y sus tarifas</p>
      </div>
      <a class="btn btn-clinic" href="/tratamientos/nuevo" title="Registrar un nuevo tratamiento" data-bs-toggle="tooltip">
        <i class="bi bi-plus-lg"></i> Nuevo tratamiento
      </a>
    </div>

    <div class="card-soft">
      <div class="table-responsive">
        <table class="table table-clinic mb-0 align-middle">
          <thead>
            <tr>
              <th>Nombre</th>
              <th class="d-none d-md-table-cell">Descripción</th>
              <th>Costo</th>
              <th class="d-none d-lg-table-cell">Duración (min)</th>
              <th class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="t : ${tratamientos}">
              <td class="fw-semibold" th:text="${t.nombre}">Nombre</td>
              <td class="d-none d-md-table-cell text-muted" th:text="${t.descripcion}">Descripción</td>
              <td th:text="${'$' + #numbers.formatDecimal(t.costo, 0, 'COMMA', 2, 'POINT')}">$0.00</td>
              <td class="d-none d-lg-table-cell" th:text="${t.duracionEstimada}">30</td>
              <td class="text-end">
                <a class="btn btn-sm btn-outline-clinic" th:href="@{/tratamientos/editar/{id}(id=${t.idTratamiento})}"
                   title="Editar este tratamiento" data-bs-toggle="tooltip"><i class="bi bi-pencil-square"></i> Editar</a>
                <form th:action="@{/tratamientos/eliminar/{id}(id=${t.idTratamiento})}" method="post" class="d-inline"
                      data-confirm="¿Eliminar este tratamiento del catálogo?">
                  <button type="submit" class="btn btn-sm btn-outline-danger"
                          title="Eliminar este tratamiento" data-bs-toggle="tooltip"><i class="bi bi-trash3"></i> Eliminar</button>
                </form>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(tratamientos)}">
              <td colspan="5" class="text-center text-muted py-4">No hay tratamientos en el catálogo todavía.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
