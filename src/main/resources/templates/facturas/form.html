<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Generar factura')}"></head>
<body>
<div th:replace="~{fragments/layout :: topbar}"></div>
<div class="app-shell">
  <aside th:replace="~{fragments/layout :: sidebar('facturas')}"></aside>
  <div th:replace="~{fragments/layout :: offcanvasMenu('facturas')}"></div>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1>Generar factura</h1>
        <p th:text="'Cita de ' + ${cita.paciente.nombre} + ' ' + ${cita.paciente.apellido} + ' — ' + ${#temporals.format(cita.fechaHora, 'dd/MM/yyyy HH:mm')}">Cita</p>
      </div>
      <a class="btn btn-outline-clinic" th:href="@{/citas/detalle/{id}(id=${cita.idCita})}"
         title="Volver a la cita" data-bs-toggle="tooltip"><i class="bi bi-arrow-left"></i> Volver a la cita</a>
    </div>

    <div class="card-soft p-3 p-lg-4" style="max-width: 560px;">
      <div class="mb-3">
        <div class="small text-muted">Total calculado (tratamientos aplicados)</div>
        <div class="h3" th:text="${'$' + #numbers.formatDecimal(total, 0, 'COMMA', 2, 'POINT')}">$0.00</div>
      </div>

      <form th:action="@{/facturas/generar/{id}(id=${cita.idCita})}" method="post" class="needs-validation" novalidate>
        <label class="form-label">Método de pago *</label>
        <select name="metodoPago" class="form-select mb-3" required>
          <option value="">Selecciona...</option>
          <option th:each="m : ${metodosPago}" th:value="${m}" th:text="${m}">Efectivo</option>
        </select>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-clinic" title="Generar la factura" data-bs-toggle="tooltip">
            <i class="bi bi-receipt"></i> Generar factura
          </button>
          <a class="btn btn-outline-secondary" th:href="@{/citas/detalle/{id}(id=${cita.idCita})}"
             title="Cancelar" data-bs-toggle="tooltip"><i class="bi bi-x-lg"></i> Cancelar</a>
        </div>
      </form>
    </div>
  </main>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
